name: Build and Push Image

on:
  workflow_dispatch:
    inputs:
      ZIG_VERSION:
        description: Zig version
        required: true
        type: string
        default: 0.15.2
      GHOSTTY_COMMIT:
        description: Ghostty commit ID
        required: true
        type: string
        default: d4ac93a0395d321b043ee0116dc8a1a384f0fb83
      BUILD_VERSION:
        description: Build version (leave empty for run number and attempt)
        required: false
        type: string
      PLATFORMS:
        description: Target platforms
        required: true
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/jumpserver-dev/libghostty-vt

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tag
        id: meta
        env:
          GHOSTTY_COMMIT: ${{ inputs.GHOSTTY_COMMIT }}
          ZIG_VERSION: ${{ inputs.ZIG_VERSION }}
          BUILD_VERSION: ${{ inputs.BUILD_VERSION }}
        run: |
          set -euo pipefail
          [[ "${GHOSTTY_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${ZIG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          build_version="${BUILD_VERSION:-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"
          [[ "${build_version}" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]
          short_commit="${GHOSTTY_COMMIT:0:12}"
          image_tag="ghostty-${short_commit,,}-zig-${ZIG_VERSION}-build-${build_version}"
          [[ ${#image_tag} -le 128 ]]
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.PLATFORMS }}
          push: true
          build-args: |
            ZIG_VERSION=${{ inputs.ZIG_VERSION }}
            GHOSTTY_COMMIT=${{ inputs.GHOSTTY_COMMIT }}
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.image_tag }}
